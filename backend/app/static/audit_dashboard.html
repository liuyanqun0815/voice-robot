<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Robot 审计仪表盘</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --ok: #22c55e;
      --err: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .api-key-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-left: auto;
    }
    input, select, button {
      font: inherit;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 0.45rem 0.65rem;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.secondary { background: transparent; color: var(--text); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    main { padding: 1.25rem 1.5rem; max-width: 1400px; margin: 0 auto; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }
    .card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .card .value { font-size: 1.5rem; font-weight: 700; margin-top: 0.25rem; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      align-items: flex-end;
    }
    .filters label { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.75rem; color: var(--muted); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      background: var(--panel);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th, td { padding: 0.6rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; background: rgba(0,0,0,0.2); }
    tr:hover td { background: rgba(59, 130, 246, 0.08); }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge.ok { background: rgba(34, 197, 94, 0.2); color: var(--ok); }
    .badge.err { background: rgba(239, 68, 68, 0.2); color: var(--err); }
    .badge.mode { background: rgba(59, 130, 246, 0.2); color: var(--accent); }
    .pager { margin-top: 1rem; display: flex; gap: 0.5rem; align-items: center; }
    .status-bar { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.75rem; }
    .status-bar.error { color: var(--err); }
    .link-btn { background: none; border: none; color: var(--accent); padding: 0; cursor: pointer; text-decoration: underline; }
    dialog {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      max-width: 720px;
      width: 92%;
      padding: 0;
    }
    dialog::backdrop { background: rgba(0,0,0,0.6); }
    .modal-head { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 1rem 1.25rem; max-height: 70vh; overflow: auto; }
    .modal-body pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--bg);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      margin: 0.35rem 0 1rem;
    }
    .sources { list-style: none; padding: 0; margin: 0; }
    .sources li { font-size: 0.8rem; color: var(--accent); margin: 0.2rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Voice Robot 审计仪表盘</h1>
    <div class="api-key-row">
      <label style="font-size:0.75rem;color:var(--muted)">API Key</label>
      <input type="password" id="apiKey" placeholder="X-Admin-Api-Key" style="min-width:200px" />
      <button type="button" id="saveKeyBtn">保存并刷新</button>
    </div>
  </header>
  <main>
    <p class="status-bar" id="statusBar">请配置 API Key 后加载数据</p>
    <section class="cards" id="statsCards"></section>
    <section class="filters">
      <label>会话 ID <input type="text" id="fSession" placeholder="session_..." /></label>
      <label>状态
        <select id="fStatus">
          <option value="">全部</option>
          <option value="ok">ok</option>
          <option value="error">error</option>
        </select>
      </label>
      <label>输入模式
        <select id="fMode">
          <option value="">全部</option>
          <option value="voice">voice</option>
          <option value="text">text</option>
        </select>
      </label>
      <label>开始日期 <input type="date" id="fFrom" /></label>
      <label>结束日期 <input type="date" id="fTo" /></label>
      <button type="button" id="searchBtn">查询</button>
      <button type="button" class="secondary" id="exportBtn">导出 CSV</button>
    </section>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>时间</th>
          <th>会话</th>
          <th>轮次</th>
          <th>模式</th>
          <th>状态</th>
          <th>延迟(ms)</th>
          <th>工具</th>
          <th>来源数</th>
          <th>用户问</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="turnTable"></tbody>
    </table>
    <div class="pager">
      <button type="button" class="secondary" id="prevBtn" disabled>上一页</button>
      <span id="pageInfo">0 / 0</span>
      <button type="button" class="secondary" id="nextBtn" disabled>下一页</button>
    </div>
  </main>

  <dialog id="detailDialog">
    <div class="modal-head">
      <strong id="detailTitle">轮次详情</strong>
      <button type="button" class="secondary" id="closeDetail">关闭</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </dialog>

  <script>
    const STORAGE_KEY = "voice_robot_audit_api_key";
    const PAGE_SIZE = 30;
    let offset = 0;
    let total = 0;

    const apiKeyInput = document.getElementById("apiKey");
    const statusBar = document.getElementById("statusBar");

    function getApiKey() {
      return (apiKeyInput.value || sessionStorage.getItem(STORAGE_KEY) || "").trim();
    }

    function saveApiKey() {
      const key = apiKeyInput.value.trim();
      if (key) sessionStorage.setItem(STORAGE_KEY, key);
      loadAll();
    }

    async function apiFetch(path, params = {}) {
      const key = getApiKey();
      if (!key) throw new Error("请先填写并保存 API Key");
      const qs = new URLSearchParams(params);
      const url = path + (qs.toString() ? "?" + qs.toString() : "");
      const res = await fetch(url, { headers: { "X-Admin-Api-Key": key } });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || res.statusText || "请求失败");
      }
      return res.json();
    }

    function fmtTime(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      return d.toLocaleString("zh-CN", { hour12: false });
    }

    function trunc(s, n) {
      if (!s) return "";
      return s.length > n ? s.slice(0, n) + "…" : s;
    }

    async function loadStats() {
      const params = buildFilterParams(false);
      const stats = await apiFetch("/admin/audit/stats", params);
      const cards = [
        ["总轮次", stats.total_turns],
        ["成功", stats.ok_count],
        ["失败", stats.error_count],
        ["平均延迟(ms)", stats.avg_latency_ms],
        ["调用知识库", (stats.tool_called_rate * 100).toFixed(1) + "%"],
        ["独立会话", stats.unique_sessions],
      ];
      document.getElementById("statsCards").innerHTML = cards
        .map(([label, value]) => `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`)
        .join("");
    }

    function buildFilterParams(includePaging) {
      const p = {};
      const session = document.getElementById("fSession").value.trim();
      const status = document.getElementById("fStatus").value;
      const mode = document.getElementById("fMode").value;
      const from = document.getElementById("fFrom").value;
      const to = document.getElementById("fTo").value;
      if (session) p.session_id = session;
      if (status) p.status = status;
      if (mode) p.input_mode = mode;
      if (from) p.from = from;
      if (to) p.to = to;
      if (includePaging) {
        p.limit = String(PAGE_SIZE);
        p.offset = String(offset);
      }
      return p;
    }

    async function loadTurns() {
      const data = await apiFetch("/admin/audit/turns", buildFilterParams(true));
      total = data.total;
      const tbody = document.getElementById("turnTable");
      tbody.innerHTML = data.items
        .map((row) => {
          const statusCls = row.status === "ok" ? "ok" : "err";
          return `<tr>
            <td>${row.id}</td>
            <td>${fmtTime(row.created_at)}</td>
            <td title="${row.session_id}">${trunc(row.session_id, 12)}</td>
            <td>${trunc(row.turn_id, 10)}</td>
            <td><span class="badge mode">${row.input_mode}</span></td>
            <td><span class="badge ${statusCls}">${row.status}</span></td>
            <td>${row.latency_ms_e2e}</td>
            <td>${row.tool_called ? "是" : "否"}</td>
            <td>${(row.wiki_sources || []).length}</td>
            <td title="${escapeHtml(row.user_text)}">${trunc(row.user_text, 28)}</td>
            <td><button type="button" class="link-btn" data-id="${row.id}">详情</button></td>
          </tr>`;
        })
        .join("");
      document.getElementById("pageInfo").textContent =
        `${offset + 1}-${Math.min(offset + PAGE_SIZE, total)} / ${total}`;
      document.getElementById("prevBtn").disabled = offset <= 0;
      document.getElementById("nextBtn").disabled = offset + PAGE_SIZE >= total;
      tbody.querySelectorAll("[data-id]").forEach((btn) => {
        btn.addEventListener("click", () => showDetail(Number(btn.dataset.id)));
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function showDetail(id) {
      const row = await apiFetch(`/admin/audit/turns/${id}`);
      const sources = (row.wiki_sources || []).map((p) => `<li>${escapeHtml(p)}</li>`).join("") || "<li>（无）</li>";
      const notes = (row.retrieval_notes || []).join("；") || "（无）";
      document.getElementById("detailTitle").textContent = `轮次 #${row.id} · ${row.session_id}`;
      document.getElementById("detailBody").innerHTML = `
        <p><strong>trace_id</strong> ${escapeHtml(row.trace_id)} · <strong>turn_id</strong> ${escapeHtml(row.turn_id)}</p>
        <p><strong>检索说明</strong> ${escapeHtml(notes)}</p>
        <p><strong>知识库来源</strong></p><ul class="sources">${sources}</ul>
        <p><strong>用户</strong></p><pre>${escapeHtml(row.user_text || "")}</pre>
        <p><strong>助手</strong></p><pre>${escapeHtml(row.assistant_text || "")}</pre>
        ${row.error_code ? `<p><strong>错误码</strong> ${escapeHtml(row.error_code)}</p>` : ""}
      `;
      document.getElementById("detailDialog").showModal();
    }

    async function exportCsv() {
      const key = getApiKey();
      if (!key) return;
      const params = buildFilterParams(false);
      const qs = new URLSearchParams(params);
      const res = await fetch("/admin/audit/export.csv?" + qs.toString(), {
        headers: { "X-Admin-Api-Key": key },
      });
      if (!res.ok) throw new Error("导出失败");
      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "audit_export.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function loadAll() {
      statusBar.className = "status-bar";
      statusBar.textContent = "加载中…";
      try {
        await Promise.all([loadStats(), loadTurns()]);
        statusBar.textContent = `已更新 · ${new Date().toLocaleTimeString("zh-CN")}`;
      } catch (e) {
        statusBar.className = "status-bar error";
        statusBar.textContent = e.message || String(e);
      }
    }

    document.getElementById("saveKeyBtn").addEventListener("click", saveApiKey);
    document.getElementById("searchBtn").addEventListener("click", () => { offset = 0; loadAll(); });
    document.getElementById("exportBtn").addEventListener("click", () => exportCsv().catch((e) => alert(e.message)));
    document.getElementById("prevBtn").addEventListener("click", () => { offset = Math.max(0, offset - PAGE_SIZE); loadTurns().catch(showErr); });
    document.getElementById("nextBtn").addEventListener("click", () => { offset += PAGE_SIZE; loadTurns().catch(showErr); });
    document.getElementById("closeDetail").addEventListener("click", () => document.getElementById("detailDialog").close());
    function showErr(e) { statusBar.className = "status-bar error"; statusBar.textContent = e.message; }

    const saved = sessionStorage.getItem(STORAGE_KEY);
    if (saved) {
      apiKeyInput.value = saved;
      loadAll();
    }
  </script>
</body>
</html>
